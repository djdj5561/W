  <h2>运行应用</h2>
  <p>下载或克隆仓库后，在 Windows 上双击 <code>run_app.bat</code>。脚本会安装依赖、启动 Ollama 和 Streamlit。应用地址是 <code>http://127.0.0.1:8501</code>。</p>
  <h2>文件说明</h2>
  <p><code>slides.html</code> 是本项目 PPT；<code>app.py</code> 是应用入口；<code>run_app.bat</code> 是 Windows 启动脚本；<code>README.md</code> 是完整说明。</p>
